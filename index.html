<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vetores Mecânicos - Feira de Ciências</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>Vetores Mecânicos</h1>
    <p>Aprenda sobre os transmissores de patógenos e os riscos à saúde pública.</p>
  </header>

  <main class="container">
    
    <!-- Card Mosca -->
   <div class="card" onclick="openModal('mosca')">
      <div class="img-container">
        <img src="M-logo.png" alt="Logo Mosca" width="128" height="132">
      </div>
      <h2>Mosca-doméstica</h2>
      <p class="subtitle">Transmissora de Cólera</p>
      <button class="btn">Saiba Mais</button>
    </div>
    
    <!-- Card Barata -->
    <a href="https://meninotazz.github.io/Barata-F/" class="card-link" target="_blank" rel="noopener noreferrer">
      <div class="card">
        <div class="img-container">
          <img src="B-logo.png" alt="Logo Barata" width="128" height="132">
        </div>
        <h2>Barata</h2>
        <p class="subtitle">Transmissora de Salmonelose</p>
        <button class="btn">Saiba Mais</button>
      </div>
    </a>

    <!-- Card Rato -->
    <a href="https://meninotazz.github.io/Rato-F/" class="card-link" target="_blank" rel="noopener noreferrer">
      <div class="card">
        <div class="img-container">
          <img src="R-logo.png" alt="Logo Rato" width="128" height="132">
        </div>
        <h2>Rato Urbano</h2>
        <p class="subtitle">Transmissor de Leptospirose</p>
        <button class="btn">Saiba Mais</button>
      </div>
    </a>

    <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modal-body">
        <!-- O JS vai colocar o conteúdo aqui -->
      </div>
    </div>
  </div>

  </main>

  <footer>
    <p>&copy; Projetos da Feira de Ciências - Vetores Mecânicos</p>
  </footer>

</body>
</html>
